<style>
#atv {
    --ok: #1d9e75;
    --warn: #e0a030;
    --track: color-mix(in srgb, var(--content-color) 14%, transparent);
    --line: color-mix(in srgb, var(--content-color) 16%, transparent);
    --soft: color-mix(in srgb, var(--content-color) 60%, transparent);
    --btn: color-mix(in srgb, var(--content-color) 10%, transparent);
    position: relative;
    box-sizing: border-box;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    font: inherit;
    padding-right: 0.7em;
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--content-color) 30%, transparent) transparent;
}
#atv * { box-sizing: border-box; }
#atv::-webkit-scrollbar { width: 0.35em; }
#atv::-webkit-scrollbar-track { background: transparent; }
#atv::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--content-color) 30%, transparent); border-radius: 0.2em; }
#atv::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }
#atv .head { display: flex; align-items: center; justify-content: space-between; gap: 0.5em; color: var(--soft); font-size: 0.85em; }
#atv .head .who { display: flex; align-items: center; min-width: 0; }
#atv .head .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#atv .dot { flex: none; display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; margin-right: 0.45em; background: var(--soft); }
#atv .dot.playing { background: var(--ok); }
#atv .dot.paused { background: var(--warn); }
#atv .meta { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 0.8em 0.3em; min-height: 6em; }
#atv .title { font-size: 1.5em; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#atv .sub { margin-top: 0.3em; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#atv .sub.album { font-size: 0.85em; }
#atv .idle { color: var(--soft); font-size: 1.1em; }
#atv .prog { margin: 0 0.2em 0.6em; }
#atv .bar { height: 0.35em; border-radius: 0.2em; background: var(--track); overflow: hidden; }
#atv .bar i { display: block; height: 100%; width: 0; background: var(--accent-color); border-radius: 0.2em; }
#atv .times { display: flex; justify-content: space-between; margin-top: 0.25em; font-size: 0.8em; color: var(--soft); }
#atv .row { display: flex; justify-content: center; align-items: center; gap: 0.5em; margin-bottom: 0.5em; }
#atv button { font: inherit; color: inherit; background: var(--btn); border: 0; border-radius: 0.5em; padding: 0.5em 0.7em; cursor: pointer; line-height: 0; display: inline-flex; align-items: center; justify-content: center; min-width: 2.6em; }
#atv button:active { background: color-mix(in srgb, var(--content-color) 22%, transparent); }
#atv button svg { width: 1.2em; height: 1.2em; fill: currentColor; }
#atv button.main { background: var(--accent-color); color: var(--card-color); min-width: 3.6em; padding: 0.65em 0.9em; border-radius: 2em; }
#atv button.main svg { width: 1.5em; height: 1.5em; }
#atv button.txt { line-height: 1.2; font-weight: 700; }
#atv button.on { background: color-mix(in srgb, var(--accent-color) 30%, transparent); }
#atv .remote { display: none; margin-top: 0.3em; }
#atv .remote.show { display: block; }
#atv .pad { display: grid; grid-template-columns: repeat(3, 3.2em); grid-template-rows: repeat(3, 3.2em); gap: 0.4em; justify-content: center; margin-bottom: 0.6em; }
#atv .pad button { width: 100%; height: 100%; }
#atv .pad button.sel { border-radius: 50%; background: var(--accent-color); color: var(--card-color); font-weight: 700; }
#atv .off { opacity: 0.45; pointer-events: none; }
</style>
<div id="atv">
    <div class="head">
        <div class="who"><i class="dot" id="atv-dot"></i><span id="atv-who"></span></div>
        <span id="atv-state"></span>
    </div>
    <div class="meta" id="atv-meta"></div>
    <div class="prog" id="atv-prog">
        <div class="bar"><i id="atv-fill"></i></div>
        <div class="times"><span id="atv-pos">0:00</span><span id="atv-dur">0:00</span></div>
    </div>
    <div id="atv-ctl">
        <div class="row">
            <button data-c="previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
            <button data-c="skipBackward"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zM12 12l8.5 6V6z"/></svg></button>
            <button class="main" data-c="playPause" id="atv-pp"></button>
            <button data-c="skipForward"><svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6zM12 12 3.5 6v12z"/></svg></button>
            <button data-c="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        </div>
        <div class="row">
            <button class="txt" data-c="volumeDown">&minus;</button>
            <button data-c="volumeUp" class="txt">+</button>
            <button id="atv-rbtn" class="txt"></button>
            <button data-c="wakeup"><svg viewBox="0 0 24 24"><path d="M11 3h2v10h-2zM17.8 6.2l-1.4 1.4A6 6 0 1 1 7.6 7.6L6.2 6.2a8 8 0 1 0 11.6 0z"/></svg></button>
            <button data-c="suspend"><svg viewBox="0 0 24 24"><path d="M20 12.8A8 8 0 0 1 11.2 4 8 8 0 1 0 20 12.8z"/></svg></button>
        </div>
        <div class="remote" id="atv-remote">
            <div class="pad">
                <button data-c="menu"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7 1.4-1.4L10.8 12l5.6-5.6z"/></svg></button>
                <button data-c="up"><svg viewBox="0 0 24 24"><path d="m12 7 7 8H5z"/></svg></button>
                <button data-c="topMenu"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-5l1 2H8l1-2H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v8h14V7z"/></svg></button>
                <button data-c="left"><svg viewBox="0 0 24 24"><path d="m7 12 8-7v14z"/></svg></button>
                <button data-c="select" class="sel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg></button>
                <button data-c="right"><svg viewBox="0 0 24 24"><path d="m17 12-8 7V5z"/></svg></button>
                <button data-c="home"><svg viewBox="0 0 24 24"><path d="M12 4 3 12h3v8h4v-5h4v5h4v-8h3z"/></svg></button>
                <button data-c="down"><svg viewBox="0 0 24 24"><path d="m12 17-7-8h14z"/></svg></button>
                <button data-c="homeHold"><svg viewBox="0 0 24 24"><path d="M12 4 3 12h3v8h4v-5h4v5h4v-8h3zM11 11h2v4h-2z"/></svg></button>
            </div>
        </div>
    </div>
</div>
<script>
var atv = { d: null, recv: 0, timer: null, remote: false };

var ATV_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
var ATV_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

function atvEsc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function atvTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

function atvFit() {
    var s = getComputedStyle(document.body);
    var h = window.innerHeight - (parseFloat(s.marginTop) || 0) - (parseFloat(s.marginBottom) || 0);
    document.getElementById('atv').style.height = h + 'px';
}

// Aktuelle Position: letzte gemeldete Position plus die seitdem vergangene Zeit, solange wiedergegeben wird
function atvPosition() {
    var d = atv.d;
    var pos = d.position;
    if (d.deviceState === 'playing') {
        var base = d.positionAt > 0 ? Math.max(0, d.now - d.positionAt) : 0;
        pos += base + (Date.now() - atv.recv) / 1000;
    }
    return d.duration > 0 ? Math.min(pos, d.duration) : pos;
}

function atvTick() {
    var d = atv.d;
    if (!d) { return; }
    var has = d.duration > 0;
    document.getElementById('atv-prog').style.visibility = has ? 'visible' : 'hidden';
    if (!has) { return; }
    var pos = atvPosition();
    document.getElementById('atv-fill').style.width = (100 * pos / d.duration) + '%';
    document.getElementById('atv-pos').textContent = atvTime(pos);
    document.getElementById('atv-dur').textContent = atvTime(d.duration);
}

function atvRender() {
    var d = atv.d;
    var t = d.texts;
    var state = d.deviceState;
    var standby = d.powerState === 'off';
    var stateText = !d.active ? t['Not configured'] : standby ? t['Standby']
        : state === 'playing' ? t['Playing'] : state === 'paused' ? t['Paused']
        : state === 'stopped' ? t['Stopped'] : t['Idle'];

    document.getElementById('atv-dot').className = 'dot ' + (standby ? '' : state);
    document.getElementById('atv-who').textContent = [d.name, d.app].filter(Boolean).join(' · ');
    document.getElementById('atv-state').textContent = stateText;

    var meta = '';
    if (d.title || d.artist || d.album) {
        meta += '<div class="title">' + atvEsc(d.title || d.album) + '</div>';
        if (d.artist) { meta += '<div class="sub">' + atvEsc(d.artist) + '</div>'; }
        if (d.album && d.title) { meta += '<div class="sub album">' + atvEsc(d.album) + '</div>'; }
    } else {
        meta = '<div class="idle">' + atvEsc(t['Nothing playing']) + '</div>';
    }
    document.getElementById('atv-meta').innerHTML = meta;

    document.getElementById('atv-pp').innerHTML = state === 'playing' ? ATV_PAUSE : ATV_PLAY;
    document.getElementById('atv-ctl').className = d.active ? '' : 'off';
    var rb = document.getElementById('atv-rbtn');
    rb.textContent = t['Remote'];
    rb.className = 'txt' + (atv.remote ? ' on' : '');
    document.getElementById('atv-remote').className = 'remote' + (atv.remote ? ' show' : '');
    atvTick();
}

function handleMessage(data) {
    atv.d = JSON.parse(data);
    atv.recv = Date.now();
    atvRender();
    if (!atv.timer) { atv.timer = setInterval(atvTick, 1000); }
}

document.getElementById('atv').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    if (b.id === 'atv-rbtn') {
        atv.remote = !atv.remote;
        if (atv.d) { atvRender(); }
        return;
    }
    if (b.dataset.c) { requestAction('Controls', b.dataset.c); }
});
window.addEventListener('resize', atvFit);
atvFit();
</script>
